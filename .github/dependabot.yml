# Dependabot — dependency updates (OWASP A06 / supply chain hygiene)
#
# Grouping policy (balance review load vs. bisectability):
#   - patch + minor version updates → one weekly PR per ecosystem
#   - security updates (CVE) → one PR per ecosystem when multiple land together
#   - major version updates → not grouped (individual PRs for breaking-change review)
#
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#groups

version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-patch-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # arq 0.28.x depends on redis>=4.2,<6. Ignore redis 6+ until arq stack is upgraded
    # (Dependabot otherwise opens major bumps like 5.x → 7.x that fail pip resolve / CI).
    ignore:
      - dependency-name: redis
        versions: [">=6.0.0"]
    groups:
      pip-patch-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-patch-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

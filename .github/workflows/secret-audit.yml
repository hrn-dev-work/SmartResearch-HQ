# Standalone workflow when the repo has no CI yet.
# Job name MUST stay "secret-audit" (branch protection context).

name: secret-audit

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: secret-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-audit:
    name: secret-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure .trivyignore exists
        run: test -f .trivyignore || touch .trivyignore

      - name: Baseline secret checks (strict)
        run: bash scripts/secret-audit.sh --strict

      - name: Gitleaks scan (required)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy secret scan (required)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: 1
          trivyignores: .trivyignore
          trivy-args: --skip-dirs node_modules --skip-dirs .venv --skip-dirs .next --skip-dirs dist --skip-dirs coverage

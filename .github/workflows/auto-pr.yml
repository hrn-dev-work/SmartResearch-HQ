name: Auto PR

on:
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  ensure-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR if missing
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            if (branch === 'main' || branch === 'master') {
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'main';
            const head = `${owner}:${branch}`;

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head,
              state: 'open',
              per_page: 1,
            });

            if (existing.length > 0) {
              core.info(`Open PR already exists: #${existing[0].number}`);
              return;
            }

            let compare;
            try {
              compare = await github.rest.repos.compareCommits({
                owner,
                repo,
                base,
                head: branch,
              });
            } catch (error) {
              core.setFailed(`Cannot compare ${base}...${branch}: ${error.message}`);
              return;
            }

            const commits = compare.data.commits ?? [];
            if (commits.length === 0) {
              core.info('No commits ahead of main — skip PR');
              return;
            }

            const title =
              commits[commits.length - 1].commit.message.split('\n')[0] ||
              `Merge ${branch} into ${base}`;

            const commitLines = commits
              .slice(-15)
              .map((c) => `- ${c.commit.message.split('\n')[0]}`)
              .join('\n');

            const body = [
              '## Summary',
              `Auto-created on push to \`${branch}\`.`,
              '',
              '## Commits',
              commitLines,
              '',
              '## Test plan',
              '- [ ] `bash scripts/ci-check.sh` passes',
              '- [ ] CI `backend` / `frontend` green',
              '',
              '## Related',
              `- Branch: \`${branch}\``,
            ].join('\n');

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base,
              body,
            });

            core.info(`Created PR #${pr.number}: ${pr.html_url}`);

name: Auto PR

on:
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  ensure-pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create PR if missing (bilingual template)
        env:
          GH_TOKEN: ${{ secrets.GH_PR_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          BASE="main"

          if gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            echo "Open PR already exists for $BRANCH"
            exit 0
          fi

          AHEAD="$(git rev-list --count "origin/${BASE}..HEAD" 2>/dev/null || echo 0)"
          if [[ "$AHEAD" -eq 0 ]]; then
            echo "No commits ahead of $BASE — skip PR"
            exit 0
          fi

          TITLE="$(bash scripts/render-pr-title.sh "$BASE" "$BRANCH")"
          BODY="$(bash scripts/render-pr-body.sh auto "$BRANCH" "$BASE")"
          bash scripts/validate-pr-body.sh --stdin <<<"$BODY"

          gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body "$BODY" || {
            echo "WARN: gh pr create failed (token or branch). Create locally: bash scripts/git-ship.sh pr"
            exit 0
          }

          PR_NUM="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          bash scripts/sync-pr-checkboxes.sh "$PR_NUM" || true
          echo "Created PR #$PR_NUM with bilingual body"

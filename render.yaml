# Render Blueprint — SmartResearch-HQ API (Portfolio mode)
# https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo in Render Dashboard → New → Blueprint → apply.
# After Vercel deploy, set ALLOWED_ORIGINS to your frontend URL(s).

services:
  - type: web
    name: smartresearch-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_MODE
        value: portfolio
      - key: ALLOWED_ORIGINS
        value: ""
        # Set after Vercel deploy, e.g.:
        # https://your-app.vercel.app,https://your-app-git-main.vercel.app
